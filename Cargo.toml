[package]
name = "claude-sdk-rs"
version = "2.0.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
repository = "https://github.com/bredmond1019/claude-code-sdk-rs"
homepage = "https://github.com/bredmond1019/claude-code-sdk-rs"
documentation = "https://docs.rs/claude-sdk-rs"
authors = ["Brandon Redmond <brandon@github.com>"]
description = "Type-safe, async Rust SDK that wraps the Claude Code CLI in a typed API"
keywords = ["claude", "anthropic", "ai", "sdk", "async"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"


[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
which = "6.0"
parking_lot = "0.12"
rand = "0.8"
once_cell = "1.19"
num_cpus = "1.16"
libc = "0.2"

# Optional: persistent session storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], optional = true }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[features]
default = []

# Optional SQLite-backed session persistence (drives core/session/sqlite_storage.rs)
sqlite = ["dep:sqlx"]

# Benchmarks
[[bench]]
name = "performance"
harness = false
path = "benches/performance.rs"

[package.metadata.docs.rs]
features = ["sqlite"]
rustdoc-args = ["--cfg", "docsrs"]
